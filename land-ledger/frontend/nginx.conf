# LAND LEDGER — frontend nginx configuration
# Serves the Vite SPA and reverse-proxies API/uploads to the backend service.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow property documents/images uploaded through the API
    client_max_body_size 12m;

    # SPA history-API routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> Express backend (compose service name "backend", internal port 3000)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Uploaded documents/images are served by the backend too
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never expose the Prometheus metrics endpoint through the public frontend
    location = /metrics {
        deny all;
        return 404;
    }
}
