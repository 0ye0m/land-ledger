#####################################################################
# ⚠️  TEMPLATE ONLY — REPLACE ALL VALUES BEFORE APPLYING TO A CLUSTER
#
# Every value below is a placeholder. Generate real credentials, e.g.:
# #   JWT_SECRET:      openssl rand -hex 32
#   OPERATOR KEY:    dedicated wallet funded ONLY for this network
#
# For production prefer sealing this file (SOPS/sealed-secrets/ExternalSecrets)
# instead of committing plaintext secrets.
#####################################################################
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: land-ledger
  labels:
    app.kubernetes.io/name: land-ledger
    app.kubernetes.io/component: backend
type: Opaque
# stringData accepts plaintext (the API server base64-encodes it) —
# no manual base64 needed, which keeps the "REPLACE BEFORE APPLY" values obvious.
stringData:
  JWT_SECRET: "REPLACE_BEFORE_APPLY_WITH_RANDOM_64_CHARS"   # REPLACE BEFORE APPLY
  BLOCKCHAIN_OPERATOR_PRIVATE_KEY: "0xREPLACE_BEFORE_APPLY_OPERATOR_WALLET_KEY" # REPLACE BEFORE APPLY
  # MongoDB Atlas connection string (free M0 is fine for dev/demo). Leave empty to skip MongoDB.
  MONGODB_URI: "REPLACE_BEFORE_APPLY_OR_LEAVE_EMPTY"        # REPLACE BEFORE APPLY (mongodb+srv://...)
