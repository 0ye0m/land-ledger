# LAND LEDGER — Grafana dashboard provisioning
apiVersion: 1

providers:
  - name: land-ledger
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
